name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pas de `nix flake update` ici : les lock sont partagés avec HavenOS et
# nixbian, les bouger casse la parité de cache.
#
# Pas de job `nix flake check --no-build` non plus : l'évaluation réalise le
# `.config` du noyau nixbian (contexte de chaîne dans
# nix/parts/nixos-module.nix), donc elle exige un store déjà peuplé et échoue
# à froid avec `path '…-linux-nixbian-linux-meson64-edge.config.drv' is not
# valid`. Un vrai build construit cet artefact : le job `build` couvre donc
# déjà la porte d'évaluation.

jobs:
  build:
    name: build ${{ matrix.package }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        package:
          - magicsee-n5-sd-image
          - magicsee-n5-installer-image
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Cache binaire partagé avec le poste de dev et HavenOS : sans lui, une
      # image complète rebâtit le noyau depuis les sources à chaque run.
      - uses: cachix/cachix-action@v15
        with:
          name: havenos

      # Les runners GitHub ont ~14 Gio libres ; une image SD + son store n'y
      # tiennent pas. On récupère l'espace des toolchains préinstallées.
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Runner arm64 natif : pas d'émulation binfmt, contrairement au poste
      # x86_64 où un noyau ou un ffmpeg patché coûte des heures.
      - name: nix build .#packages.aarch64-linux.${{ matrix.package }}
        run: |
          nix build ".#packages.aarch64-linux.${{ matrix.package }}" \
            --no-link --print-build-logs
