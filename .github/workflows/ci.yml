name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pas de `nix flake update` ici : les lock sont partagés avec HavenOS et
# nixbian, les bouger casse la parité de cache.
#
# Pas de job `nix flake check --no-build` non plus : l'évaluation réalise le
# `.config` du noyau nixbian (contexte de chaîne dans
# nix/parts/nixos-module.nix), donc elle exige un store déjà peuplé et échoue
# à froid avec `path '…-linux-nixbian-linux-meson64-edge.config.drv' is not
# valid`. Un vrai build construit cet artefact : le job `build` couvre donc
# déjà la porte d'évaluation.

jobs:
  # Le noyau patché seul, pour remplir le cache. Les deux jobs d'image
  # ci-dessous dépassent le plafond GitHub de 6 h par job et sont annulés
  # avant d'avoir rien poussé (aucun run vert depuis la création du repo) :
  # ce job tient en ~1 h et suffit à ce qu'un build local du toplevel
  # substitue le noyau au lieu de le recompiler sous binfmt.
  #
  # Runner **x86_64**, pas ARM : la dérivation du noyau est un cross
  # x86_64→aarch64, donc son `system` est `x86_64-linux` (`nix derivation
  # show`). Sur un runner ARM elle est exécutée sous qemu (d'où les 6 h des
  # jobs d'image, qui doivent en plus émuler `x86_64-linux`), alors qu'ici
  # elle se compile nativement.
  #
  # La publication exige les deux secrets du cache (comme HavenOS/ci.yml) :
  #   CACHIX_AUTH_TOKEN  — token « read and write » ;
  #   CACHIX_SIGNING_KEY — signature côté client (le cache refuse un narinfo
  #                        non signé). Sans eux, le job construit mais ne
  #                        pousse rien : le log dit « Pushing is disabled ».
  kernel:
    name: kernel magicsee-n5-sd
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: havenos
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'

      # Noyau + modules : la même dérivation que celle dont dérive l'image.
      - name: nix build …config.system.build.kernel
        run: |
          nix build \
            ".#nixosConfigurations.magicsee-n5-sd.config.system.build.kernel" \
            --no-link --print-build-logs

      # L'initrd entraîne les modules élagués : le pousser aussi évite de
      # les reconstruire côté poste.
      - name: nix build …config.system.build.initialRamdisk
        run: |
          nix build \
            ".#nixosConfigurations.magicsee-n5-sd.config.system.build.initialRamdisk" \
            --no-link --print-build-logs

  build:
    name: build ${{ matrix.package }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        package:
          - magicsee-n5-sd-image
          - magicsee-n5-installer-image
    steps:
      - uses: actions/checkout@v4

      # L'image embarque de l'U-Boot bâti pour x86_64 (buildPackages du cross
      # meson64), qu'un runner aarch64 ne peut pas produire nativement. Seul cet
      # outil est émulé : le noyau et le reste de l'image restent natifs, alors
      # qu'un build complet sous qemu coûte des heures.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-platforms = aarch64-linux x86_64-linux

      # Cache binaire partagé avec le poste de dev et HavenOS : sans lui, une
      # image complète rebâtit le noyau depuis les sources à chaque run.
      - uses: cachix/cachix-action@v15
        with:
          name: havenos

      # Les runners GitHub ont ~14 Gio libres ; une image SD + son store n'y
      # tiennent pas. On récupère l'espace des toolchains préinstallées.
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Runner arm64 natif : pas d'émulation binfmt, contrairement au poste
      # x86_64 où un noyau ou un ffmpeg patché coûte des heures.
      - name: nix build .#packages.aarch64-linux.${{ matrix.package }}
        run: |
          nix build ".#packages.aarch64-linux.${{ matrix.package }}" \
            --no-link --print-build-logs
